spring.application.name=SpringAI
server.port=5000

# --- Database: Local MongoDB ---
# This works for both a direct OS installation and a Docker container
spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# --- Spring AI: Google Gemini (Cloud) ---
# It is best practice to pass the key via an environment variable
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.6-flash

# --- Spring AI: Ollama / DeepSeek (Local) ---
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=deepseek-r1:1.5b

# --- Security: OAuth2 Client Credentials ---
# You will get these from the Google Cloud Console and GitHub Developer Settings
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}